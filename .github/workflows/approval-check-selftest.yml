name: approval-check self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-test:
    name: shared-ci / approval-check self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Run approval tests
        run: python -B -m unittest discover -s tests/approval-check -v
