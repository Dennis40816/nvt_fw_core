name: approval-check self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-test:
    name: shared-ci / approval-check self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run approval tests
        run: python -B -m unittest discover -s tests/approval-check -v
