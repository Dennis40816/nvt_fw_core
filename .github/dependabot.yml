version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/approval-check
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    # One pull request per update round, so the owner approves once.
    groups:
      github-actions:
        patterns:
          - "*"
